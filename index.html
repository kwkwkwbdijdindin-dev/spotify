<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuman Lagu</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --bg2:#1a1a1a; --ink:#fff; --muted:#a3a3a3;
  --c1:#ffffff; --c2:#8a8a8a; --c3:#d4d4d4; --c4:#707070; --c5:#bdbdbd;
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;color-scheme:dark}
body{
  margin:0;height:100%;min-height:100svh;overflow:hidden;
  background:radial-gradient(1200px 700px at 50% 40%,var(--bg2),var(--bg));
  color:var(--ink);font-family:var(--font);
}
.stage{position:relative;height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:10px 0}

/* color cycle for every marquee word */
@keyframes hue{
  0%{color:var(--c1)}20%{color:var(--c2)}40%{color:var(--c3)}
  60%{color:var(--c4)}80%{color:var(--c5)}100%{color:var(--c1)}
}
.w{animation:hue 7s linear infinite;white-space:nowrap}

/* horizontal marquees */
.row{overflow:hidden;width:100%;position:relative;z-index:1}
.track{display:flex;width:max-content;will-change:transform}
.track span{font-weight:800;line-height:1;padding-right:.5em}
.r1 .track{animation:left 22s linear infinite;font-size:clamp(34px,9vw,84px)}
.r2 .track{animation:right 26s linear infinite;font-size:clamp(26px,6vw,58px);opacity:.8}
.r3 .track{animation:left 34s linear infinite;font-size:clamp(22px,4.5vw,44px);opacity:.65}
.r3{transform:rotate(-2deg)}
